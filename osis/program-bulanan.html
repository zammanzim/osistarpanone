<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Program Bulanan — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=22" />
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/osis-program-bulanan.css?v=2" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js?v=14"></script>
    <script src="../js/db.js?v=27" defer></script>
    <script src="../js/aktivitas.js?v=10" defer></script>
    <script src="../js/app.js?v=10" defer></script>
    <script src="../js/dropdown.js?v=1" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/notice.js?v=10" defer></script>
    <script src="../js/upload.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=13" defer></script>
    <script src="../js/osis-auth.js?v=19" defer></script>
    <script src="../js/osis-visitor.js?v=4" defer></script>
    <script src="../js/osis-sidebar.js?v=16" defer></script>
    <script src="../js/osis-header.js?v=14" defer></script>
    <script src="../js/form-persist.js?v=10" defer></script>
    <script src="../js/program.js?v=10" defer></script>
    <script src="../js/pwa.js?v=11" defer></script>
  </head>
  <body data-tipe="bulanan">
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>PROGRAM BULANAN</h2>
          <p>Operasional OSIS</p>
        </div>
      </a>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="program-wrap">
      <div class="program-head">
        <div class="ico"><i class="fa-solid fa-calendar-days"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>PROGRAM BULANAN</h1>
          <p>Kegiatan operasional OSIS bulan per bulan.</p>
        </div>
        <button
          class="btn btn-red"
          id="btnTambahProgram"
          style="display: none"
        >
          <i class="fa-solid fa-plus"></i> Tambah Program
        </button>
      </div>

      <div class="program-cols">
      <div class="program-side">

      <div class="stat-grid">
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-list"></i> Total</span
          ><b id="statTotal">-</b>
        </div>
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-play"></i> Berjalan</span
          ><b id="statBerjalan">-</b>
        </div>
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-check"></i> Selesai</span
          ><b id="statSelesai">-</b>
        </div>
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-clock"></i> Rencana</span
          ><b id="statRencana">-</b>
        </div>
      </div>

      <div class="filter-card">
        <div class="field">
          <label>Cari program</label
          ><input
            type="text"
            id="filterQ"
            class="admin-input"
            placeholder="Nama / PIC / sekbid..."
          />
        </div>
        <div class="field">
          <label>Sekbid</label
          ><select id="filterSekbid" class="admin-input">
            <option value="">Semua sekbid</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label
          ><select id="filterStatus" class="admin-input">
            <option value="">Semua status</option>
            <option value="rencana">Rencana</option>
            <option value="berjalan">Berjalan</option>
            <option value="selesai">Selesai</option>
            <option value="batal">Batal</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label
          ><button
            class="btn btn-white btn-sm"
            id="btnResetFilter"
            title="Reset filter"
          >
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </div>
      </div>
      <div class="program-main">

      <div id="programList">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat program bulanan...
        </div>
      </div>
      </div>
      </div>
    </div>

    <!-- POPUP FORM -->
    <div class="program-form" id="programForm">
      <div class="program-form-inner">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
          "
        >
          <span
            style="
              font-weight: 900;
              display: flex;
              align-items: center;
              gap: 8px;
              font-size: 1rem;
            "
            ><i class="fa-solid fa-calendar" style="color: var(--red)"></i>
            <span id="programFormTitle">Tambah Program</span></span
          >
          <button
            class="icon-btn"
            onclick="Program.tutupForm()"
            title="Tutup"
            style="width: 34px; height: 34px; flex-shrink: 0"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="field">
          <label>Nama program</label
          ><input
            type="text"
            id="progNama"
            class="admin-input"
            placeholder="cth: Makrab OSIS 2026"
            maxlength="120"
          />
        </div>
        <div class="field">
          <label>Deskripsi</label
          ><textarea
            id="progDeskripsi"
            class="admin-input admin-textarea"
            placeholder="Deskripsi singkat program..."
            maxlength="1000"
            rows="3"
          ></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <div class="field">
            <label>Sekbid</label
            ><select id="progSekbid" class="admin-input">
              <option value="">— Pilih Sekbid —</option>
            </select>
          </div>
          <div class="field">
            <label>PIC</label
            ><input
              type="text"
              id="progPJ"
              class="admin-input"
              placeholder="Penanggung jawab"
              maxlength="80"
            />
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <div class="field">
            <label>Tanggal mulai</label
            ><input type="date" id="progMulai" class="admin-input" />
          </div>
          <div class="field">
            <label>Tanggal selesai</label
            ><input type="date" id="progSelesai" class="admin-input" />
          </div>
        </div>
        <div class="field">
          <label>Lokasi</label
          ><input
            type="text"
            id="progLokasi"
            class="admin-input"
            placeholder="Aula / Lapangan..."
            maxlength="80"
          />
        </div>
        <div class="field">
          <label>Target peserta</label
          ><input
            type="text"
            id="progTarget"
            class="admin-input"
            placeholder="cth: Seluruh siswa"
            maxlength="80"
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <div class="field">
            <label>Status</label
            ><select id="progStatus" class="admin-input">
              <option value="rencana">Rencana</option>
              <option value="berjalan">Berjalan</option>
              <option value="selesai">Selesai</option>
              <option value="batal">Batal</option>
            </select>
          </div>
          <div class="field">
            <label>Progress (<span id="progProgressLbl">0%</span>)</label
            ><input
              type="range"
              id="progProgress"
              min="0"
              max="100"
              value="0"
              step="5"
              style="width: 100%; accent-color: var(--red)"
            />
          </div>
        </div>
        <div class="field">
          <label>Catatan (opsional)</label
          ><textarea
            id="progCatatan"
            class="admin-input admin-textarea"
            placeholder="Catatan tambahan..."
            maxlength="2000"
            rows="2"
          ></textarea>
        </div>
        <div class="form-actions-row" style="margin-top: 12px">
          <button class="btn btn-white" id="btnBatalProgram">Batal</button>
          <button class="btn btn-red" id="btnSimpanProgram">
            <i class="fa-solid fa-floppy-disk"></i> Simpan
          </button>
        </div>
        <input type="hidden" id="progId" />
      </div>
    </div>

    <!-- POPUP DETAIL -->
    <div class="program-form" id="programDetail">
      <div class="program-form-inner" style="width: min(620px, 100%)">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
          "
        >
          <span
            style="
              font-weight: 900;
              display: flex;
              align-items: center;
              gap: 8px;
              font-size: 1rem;
            "
            ><i class="fa-solid fa-calendar" style="color: var(--red)"></i>
            Detail Program</span
          >
          <button
            class="icon-btn"
            onclick="Program.tutupDetail()"
            title="Tutup"
            style="width: 34px; height: 34px; flex-shrink: 0"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="programDetailBody"></div>
        <div class="form-actions-row" style="margin-top: 14px">
          <button class="btn btn-white btn-sm" onclick="Program.tutupDetail()">
            Tutup
          </button>
          <button class="btn btn-white btn-sm" id="btnEditDariDetail">
            <i class="fa-solid fa-pen"></i> Edit
          </button>
          <button class="btn btn-red btn-sm" id="btnHapusDariDetail">
            <i class="fa-solid fa-trash-can"></i> Hapus
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
