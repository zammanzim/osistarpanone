<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Aktivitas — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=40" />
<meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/osis-logs.css?v=3" />
    <script src="../js/supabase.min.js?v=10"></script>
    <script src="../js/config.js?v=14"></script>
    <script src="../js/db.js?v=35" defer></script>
    <script src="../js/aktivitas.js?v=10" defer></script>
    <script src="../js/app.js?v=10" defer></script>
    <script src="../js/dropdown.js?v=2" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/notice.js?v=10" defer></script>
    <script src="../js/upload.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=14" defer></script>
    <script src="../js/osis-auth.js?v=19" defer></script>
    <script src="../js/osis-visitor.js?v=4" defer></script>
    <script src="../js/osis-sidebar.js?v=45" defer></script>
    <script src="../js/osis-header.js?v=14" defer></script>
    <script src="../js/logs.js?v=11" defer></script>
  <script src="../js/pwa.js?v=11" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>LOGS</h2>
          <p>Aktivitas User</p>
        </div>
      </a>
      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"><i class="fa-solid fa-house"></i> Beranda</a>
        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="logs-wrap">
      <div class="logs-cols">
      <div class="logs-side">

      <div class="logs-head">
        <div class="ico"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>LOG AKTIVITAS</h1>
          <p>Pantau siapa online, buka apa, dan ngapain aja. Khusus super admin.</p>
        </div>
        <button class="btn btn-red" id="btnRefreshLogs"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>

      <div class="logs-stats">
        <div class="logs-stat online"><span class="lbl"><i class="fa-solid fa-circle-dot"></i> Online</span><b id="statOnline">-</b></div>
        <div class="logs-stat"><span class="lbl"><i class="fa-solid fa-bolt"></i> Aksi Hari Ini</span><b id="statAksiHari">-</b></div>
        <div class="logs-stat"><span class="lbl"><i class="fa-solid fa-users"></i> User Aktif Hari Ini</span><b id="statUserHari">-</b></div>
        <div class="logs-stat"><span class="lbl"><i class="fa-solid fa-database"></i> Dimuat</span><b id="statTotal">-</b></div>
      </div>

      <div class="logs-card">
        <h3><i class="fa-solid fa-circle-dot"></i> Sedang Online <span class="cnt" id="onlineCount">0</span></h3>
        <div id="onlineStrip"><span class="logs-online-empty">Memuat...</span></div>
      </div>
      </div>
      <div class="logs-main">

      <div class="filter-card">
        <div class="field"><label>Cari (nama/aksi/halaman/detail)</label><input type="text" id="filterQ" class="admin-input" placeholder="Ketik..." /></div>
        <div class="field"><label>Aksi</label><select id="filterAksi" class="admin-input"><option value="">Semua aksi</option></select></div>
        <div class="field"><label>&nbsp;</label><button class="btn btn-white btn-sm" id="btnResetFilter" title="Reset filter"><i class="fa-solid fa-rotate-left"></i></button></div>
      </div>

      <div id="logsWrap"><div class="logs-card"><div class="loading-block"><div class="spinner"></div>Memuat logs...</div></div></div>
      <div id="btnLagiWrap" style="display:none; text-align:center">
        <button class="btn btn-white" id="btnLagi"><i class="fa-solid fa-angles-down"></i> Muat 100 Lagi</button>
      </div>
      </div>
      </div>
    </div>
  </body>
</html>
