  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>LOGS</h2>
          <p>Aktivitas User</p>
        </div>
      </a>
      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"><i class="fa-solid fa-house"></i> Beranda</a>
        <div id="areaAuth"></div>
      </div>
    </header>
    <script>window.OsisShellMount&&OsisShellMount()</script>

    <div class="osis-wrap">
      <div class="osis-top-search" id="logsTopSearch" data-osis-auto-count="1">
        <div class="osis-sb-bar">
          <div class="osis-sb-row">
            <i class="fa-solid fa-magnifying-glass osis-sb-ico"></i>
            <input
              type="text"
              id="filterQ"
              class="osis-sb-input"
              placeholder="Cari nama, aksi, halaman, atau detail aktivitas..."
              autocomplete="off"
            />
            <button
              type="button"
              class="osis-sb-clear"
              data-osis-clear="auto"
              title="Hapus pencarian"
              hidden
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="osis-sb-divider" aria-hidden="true"></span>
            <button type="button" class="osis-sb-filter-btn" aria-expanded="false">
              <i class="fa-solid fa-sliders"></i>
              <span>Filter</span>
              <span class="osis-sb-badge" hidden>0</span>
              <i class="fa-solid fa-chevron-down osis-sb-chev"></i>
            </button>
          </div>
        </div>
        <div class="osis-sb-panel">
          <div class="osis-sb-panel-head">
            <span class="osis-sb-panel-title"><i class="fa-solid fa-filter"></i> Filter Aktivitas</span>
            <div class="osis-sb-panel-acts">
              <button type="button" class="btn btn-white btn-sm" id="btnResetFilter" title="Reset filter">
                <i class="fa-solid fa-rotate-left"></i> Reset
              </button>
              <button type="button" class="osis-sb-close" title="Tutup filter">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="osis-sb-fields">
            <div class="osis-sb-field grow">
              <label>Aksi</label>
              <select id="filterAksi" class="admin-input"><option value="">Semua aksi</option></select>
            </div>
            <div class="osis-sb-field grow">
              <label>Angkatan</label>
              <select id="filterAngkatan" class="admin-input"><option value="">Semua (Lintas)</option></select>
            </div>
          </div>
        </div>
      </div>

      <div class="logs-cols">
      <div class="logs-side">

      <div class="osis-hero">
        <div class="osis-avatar"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>LOG AKTIVITAS</h1>
          <p>Pantau siapa online, buka apa, dan ngapain aja. Khusus super admin.</p>
        </div>
        <button class="btn btn-red" id="btnRefreshLogs"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>

      <div class="logs-stats">
        <div class="logs-stat online"><span class="lbl"><i class="fa-solid fa-circle-dot"></i> Online</span><b id="statOnline">-</b></div>
        <div class="logs-stat"><span class="lbl"><i class="fa-solid fa-bolt"></i> Aksi Hari Ini</span><b id="statAksiHari">-</b></div>
        <div class="logs-stat"><span class="lbl"><i class="fa-solid fa-users"></i> User Aktif Hari Ini</span><b id="statUserHari">-</b></div>
        <div class="logs-stat"><span class="lbl"><i class="fa-solid fa-database"></i> Dimuat</span><b id="statTotal">-</b></div>
      </div>

      <div class="logs-card">
        <h3><i class="fa-solid fa-circle-dot"></i> Sedang Online <span class="cnt" id="onlineCount">0</span></h3>
        <div id="onlineStrip"><span class="logs-online-empty">Memuat...</span></div>
      </div>
      </div>
      <div class="logs-main">
      <div id="logsWrap"><div class="logs-card"><div class="loading-block"><div class="spinner"></div>Memuat logs...</div></div></div>
      <div id="btnLagiWrap" style="display:none; text-align:center">
        <button class="btn btn-white" id="btnLagi"><i class="fa-solid fa-angles-down"></i> Muat 100 Lagi</button>
      </div>
      </div>
      </div>
    </div>
  </body>
