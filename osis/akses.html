<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akses — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=10" />
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      .akses-wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .akses-head {
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 4px 4px 0 var(--ink);
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .akses-head .ico {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        border: 3px solid var(--ink);
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        box-shadow: 2px 2px 0 var(--ink);
        flex-shrink: 0;
      }
      .akses-head h1 {
        font-size: 1.25rem;
        font-weight: 900;
        line-height: 1.1;
      }
      .akses-head p {
        font-size: 0.8rem;
        color: var(--gray);
        font-weight: 600;
        margin-top: 4px;
      }
      .aks-card {
        margin-bottom: 12px;
      }
      .aks-sub {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--gray);
        margin: 2px 0 4px 2px;
      }
      .aks-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 8px;
      }
      @media (max-width: 560px) {
        .aks-grid { grid-template-columns: repeat(2, 1fr); }
      }
      .aks-check {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid var(--ink);
        border-radius: 10px;
        padding: 7px 10px;
        font-size: 0.74rem;
        font-weight: 800;
        cursor: pointer;
        background: var(--white);
      }
      .aks-check.on {
        background: #d6f5d6;
      }
      .aks-check input {
        width: 16px;
        height: 16px;
        accent-color: var(--red);
      }
      /* Daftar nama ringkas */
      .aks-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 11px 13px;
        margin-bottom: 8px;
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        box-shadow: 3px 3px 0 var(--ink);
        cursor: pointer;
        font-family: inherit;
        color: var(--ink);
      }
      .aks-row:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      .aks-row .ava {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        border: 2.5px solid var(--ink);
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 1rem;
        flex-shrink: 0;
      }
      .aks-row .nm { display: block; font-weight: 900; font-size: 0.88rem; overflow-wrap: anywhere; }
      .aks-row .sub { display: block; font-size: 0.7rem; color: var(--gray); font-weight: 700; margin-top: 1px; }
      .aks-row .chev { margin-left: auto; color: var(--gray); flex-shrink: 0; }
      /* Pembatas per angkatan */
      .aks-angkatan {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--ink);
        color: #fff;
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 900;
        box-shadow: 3px 3px 0 rgba(15, 10, 11, 0.25);
        margin: 12px 0 8px;
      }
      .aks-angkatan:first-child { margin-top: 0; }
      .aks-angkatan i { color: var(--yellow); }
      .aks-angkatan .cnt {
        margin-left: auto;
        font-size: 0.66rem;
        font-weight: 900;
        background: var(--yellow);
        color: var(--ink);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      /* Popup detail per orang */
      .aks-form {
        position: fixed;
        inset: 0;
        background: rgba(15, 10, 11, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 210;
        padding: 18px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          visibility 0.22s ease;
      }
      .aks-form.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .aks-form-inner {
        width: min(560px, 100%);
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 6px 6px 0 rgba(15, 10, 11, 0.55);
        max-height: 90vh;
        overflow-y: auto;
        transform: scale(0.96) translateY(10px);
        transition: transform 0.22s cubic-bezier(0.34, 1.3, 0.64, 1);
      }
      .aks-form.open .aks-form-inner {
        transform: scale(1) translateY(0);
      }
    </style>
    <script src="../js/supabase.min.js?v=10"></script>
    <script src="../js/config.js?v=13"></script>
    <script src="../js/db.js?v=13" defer></script>
    <script src="../js/app.js?v=10" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=12" defer></script>
    <script src="../js/osis-auth.js?v=14" defer></script>
    <script src="../js/osis-sidebar.js?v=13" defer></script>
    <script src="../js/form-persist.js?v=10" defer></script>
    <script src="../js/akses.js?v=18" defer></script>
    <script src="../js/pwa.js?v=10" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>AKSES</h2>
          <p>Kendali Per Halaman</p>
        </div>
      </a>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="akses-wrap">
      <div class="akses-head">
        <div class="ico"><i class="fa-solid fa-key"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>AKSES</h1>
          <p>
            Khusus super admin. Centang halaman yang boleh dikendalikan tiap
            orang. Sekbid tiap orang otomatis dari jabatannya (aturan agenda &amp; program).
          </p>
        </div>
      </div>

      <div class="rekap-card" style="padding:12px 14px">
        <div class="field" style="margin-bottom:0"><label>Cari nama</label><input type="text" id="aksesQ" class="admin-input" placeholder="Ketik nama / username..." autocomplete="off" /></div>
      </div>

      <div id="aksesWrap">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat data akses...
        </div>
      </div>
    </div>

    <!-- POPUP DETAIL: ketuk nama baru atur checkbox -->
    <div class="aks-form" id="aksDetail">
      <div class="aks-form-inner">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px">
          <span style="font-weight: 900; display: flex; align-items: center; gap: 8px; font-size: 1rem"><i class="fa-solid fa-key" style="color: var(--red)"></i> <span id="aksDetailTitle">Akses</span></span>
          <button class="icon-btn" onclick="Akses.tutupDetail()" title="Tutup" style="width: 34px; height: 34px; flex-shrink: 0"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="aksDetailBody"></div>
      </div>
    </div>
  </body>
</html>
