    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>AKSES</h2>
          <p>Kendali Per Halaman</p>
        </div>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>

    <script>window.OsisShellMount&&OsisShellMount()</script>

    <div class="osis-wrap">
      <div class="osis-top-search" id="aksesTopSearch" data-osis-auto-count="1">
        <div class="osis-sb-bar">
          <div class="osis-sb-row">
            <i class="fa-solid fa-magnifying-glass osis-sb-ico"></i>
            <input
              type="text"
              id="aksesQ"
              class="osis-sb-input"
              placeholder="Cari nama, username, atau jabatan pengurus..."
              autocomplete="off"
            />
            <button
              type="button"
              class="osis-sb-clear"
              data-osis-clear="auto"
              title="Hapus pencarian"
              hidden
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="osis-sb-divider" aria-hidden="true"></span>
            <button type="button" class="osis-sb-filter-btn" aria-expanded="false">
              <i class="fa-solid fa-sliders"></i>
              <span>Filter</span>
              <span class="osis-sb-badge" hidden>0</span>
              <i class="fa-solid fa-chevron-down osis-sb-chev"></i>
            </button>
          </div>
        </div>
        <div class="osis-sb-panel">
          <div class="osis-sb-panel-head">
            <span class="osis-sb-panel-title"><i class="fa-solid fa-filter"></i> Filter Akses</span>
            <div class="osis-sb-panel-acts">
              <button type="button" class="btn btn-white btn-sm" data-osis-reset="auto" title="Reset filter">
                <i class="fa-solid fa-rotate-left"></i> Reset
              </button>
              <button type="button" class="osis-sb-close" title="Tutup filter">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="osis-sb-fields">
            <div class="osis-sb-field grow">
              <label>Filter Angkatan</label>
              <select id="aksesFilterAng" class="admin-input"><option value="">Semua Angkatan</option></select>
            </div>
          </div>
        </div>
      </div>

      <div class="akses-cols">
      <div class="akses-side">

      <div class="osis-hero">
        <div class="osis-avatar"><i class="fa-solid fa-key"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>AKSES</h1>
          <p>
            Khusus super admin. Centang halaman yang boleh dikendalikan tiap
            orang. Sekbid tiap orang otomatis dari jabatannya (aturan agenda &amp; program).
          </p>
        </div>
      </div>
      </div>
      <div class="akses-main">

      <div id="aksesWrap">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat data akses...
        </div>
      </div>
      </div>
      </div>

            <span id="aksDetailTitle">Akses</span>
          </span>
          <button type="button" class="icon-btn" onclick="Akses.tutupDetail()" title="Tutup" style="width: 36px; height: 36px; flex-shrink: 0"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="aksDetailBody"></div>
      </div>
