<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akses — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=41" />
    <link rel="stylesheet" href="../css/osis2.css?v=14" />
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/osis-akses.css?v=4" />
    <script src="../js/supabase.min.js?v=10"></script>
    <script src="../js/config.js?v=14"></script>
    <script src="../js/db.js?v=35" defer></script>
    <script src="../js/aktivitas.js?v=10" defer></script>
    <script src="../js/app.js?v=16" defer></script>
    <script src="../js/dropdown.js?v=3" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/notice.js?v=10" defer></script>
    <script src="../js/upload.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=15" defer></script>
    <script src="../js/osis-auth.js?v=19" defer></script>
    <script src="../js/osis-visitor.js?v=5" defer></script>
    <script src="../js/osis-sidebar.js?v=45" defer></script>
    <script src="../js/osis-header.js?v=18" defer></script>
    <script src="../js/form-persist.js?v=10" defer></script>
    <script src="../js/akses.js?v=19" defer></script>
    <script src="../js/pwa.js?v=11" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>AKSES</h2>
          <p>Kendali Per Halaman</p>
        </div>
      </a>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="osis-wrap">
      <div class="osis-top-search" id="aksesTopSearch" data-osis-auto-count="1">
        <div class="osis-sb-bar">
          <div class="osis-sb-row">
            <i class="fa-solid fa-magnifying-glass osis-sb-ico"></i>
            <input
              type="text"
              id="aksesQ"
              class="osis-sb-input"
              placeholder="Cari nama, username, atau jabatan pengurus..."
              autocomplete="off"
            />
            <button
              type="button"
              class="osis-sb-clear"
              data-osis-clear="auto"
              title="Hapus pencarian"
              hidden
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="osis-sb-divider" aria-hidden="true"></span>
            <button type="button" class="osis-sb-filter-btn" aria-expanded="false">
              <i class="fa-solid fa-sliders"></i>
              <span>Filter</span>
              <span class="osis-sb-badge" hidden>0</span>
              <i class="fa-solid fa-chevron-down osis-sb-chev"></i>
            </button>
          </div>
        </div>
        <div class="osis-sb-panel">
          <div class="osis-sb-panel-head">
            <span class="osis-sb-panel-title"><i class="fa-solid fa-filter"></i> Filter Akses</span>
            <div class="osis-sb-panel-acts">
              <button type="button" class="btn btn-white btn-sm" data-osis-reset="auto" title="Reset filter">
                <i class="fa-solid fa-rotate-left"></i> Reset
              </button>
              <button type="button" class="osis-sb-close" title="Tutup filter">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="osis-sb-fields">
            <div class="osis-sb-field grow">
              <label>Filter Angkatan</label>
              <select id="aksesFilterAng" class="admin-input"><option value="">Semua Angkatan</option></select>
            </div>
          </div>
        </div>
      </div>

      <div class="akses-cols">
      <div class="akses-side">

      <div class="osis-hero">
        <div class="osis-avatar"><i class="fa-solid fa-key"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>AKSES</h1>
          <p>
            Khusus super admin. Centang halaman yang boleh dikendalikan tiap
            orang. Sekbid tiap orang otomatis dari jabatannya (aturan agenda &amp; program).
          </p>
        </div>
      </div>
      </div>
      <div class="akses-main">

      <div id="aksesWrap">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat data akses...
        </div>
      </div>
      </div>
      </div>
    </div>

    <!-- POPUP DETAIL: ketuk nama baru atur checkbox -->
    <div class="aks-form" id="aksDetail">
      <div class="aks-form-inner">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px">
          <span style="font-weight: 900; display: flex; align-items: center; gap: 8px; font-size: 1rem"><i class="fa-solid fa-key" style="color: var(--red)"></i> <span id="aksDetailTitle">Akses</span></span>
          <button class="icon-btn" onclick="Akses.tutupDetail()" title="Tutup" style="width: 34px; height: 34px; flex-shrink: 0"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="aksDetailBody"></div>
      </div>
    </div>
  </body>
</html>
