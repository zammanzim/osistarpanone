<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>(function(){try{var d=document.documentElement;d.classList.add("osis-shell");var dark=localStorage.getItem("tarpan_theme")==="dark";if(dark){d.setAttribute("data-theme","dark");d.style.backgroundColor="#16131b";var f=function(){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#16131b");};f();document.addEventListener("DOMContentLoaded",f);}else{d.style.backgroundColor="#fffdfa";}}catch(e){}})();</script>
    <title>Program Tahunan — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../assets/css/shared/style.css?v=45" />
    <link rel="stylesheet" href="../assets/css/shared/osis2.css?v=19" />
    <link rel="stylesheet" href="../assets/css/osis/program-tahunan.css?v=5" />
    <link rel="stylesheet" href="../assets/css/shared/dark.css?v=2" />
    <script src="../assets/js/osis/shell/osis-sidebar.js?v=49"></script>
    <script src="../assets/js/osis/shell/osis-header.js?v=23"></script>
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="../assets/js/vendor/supabase.min.js?v=10" defer></script>
    <script src="../assets/js/core/config.js?v=14" defer></script>
    <script src="../assets/js/core/db.js?v=35" defer></script>
    <script src="../assets/js/services/aktivitas.js?v=10" defer></script>
    <script src="../assets/js/core/app.js?v=18" defer></script>
    <script src="../assets/js/shared/ui/dropdown.js?v=3" defer></script>
    <script src="../assets/js/shared/ui/toast.js?v=10" defer></script>
    <script src="../assets/js/shared/ui/notice.js?v=10" defer></script>
    <script src="../assets/js/services/upload.js?v=10" defer></script>
    <script src="../assets/js/shared/ui/show-popup.js?v=15" defer></script>
    <script src="../assets/js/core/osis-auth.js?v=20" defer></script>
    <script src="../assets/js/osis/shell/osis-visitor.js?v=6" defer></script>
    <script src="../assets/js/shared/utilities/form-persist.js?v=10" defer></script>
    <script src="../assets/js/osis/modules/program.js?v=13" defer></script>
    <script src="../assets/js/pwa/pwa.js?v=13" defer></script>
  </head>
  <body data-tipe="tahunan">
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>PROGRAM TAHUNAN</h2>
          <p>Rencana Besar OSIS</p>
        </div>
      </a>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>
    </header>
    <script>window.OsisShellMount&&OsisShellMount()</script>

    <div class="osis-wrap">
      <div class="osis-top-search" id="progTopSearch" data-osis-auto-count="1">
        <div class="osis-sb-bar">
          <div class="osis-sb-row">
            <i class="fa-solid fa-magnifying-glass osis-sb-ico"></i>
            <input
              type="text"
              id="filterQ"
              class="osis-sb-input"
              placeholder="Cari nama program, PIC, atau sekbid..."
              autocomplete="off"
            />
            <button
              type="button"
              class="osis-sb-clear"
              data-osis-clear="auto"
              title="Hapus pencarian"
              hidden
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="osis-sb-divider" aria-hidden="true"></span>
            <button type="button" class="osis-sb-filter-btn" aria-expanded="false">
              <i class="fa-solid fa-sliders"></i>
              <span>Filter</span>
              <span class="osis-sb-badge" hidden>0</span>
              <i class="fa-solid fa-chevron-down osis-sb-chev"></i>
            </button>
          </div>
        </div>
        <div class="osis-sb-panel">
          <div class="osis-sb-panel-head">
            <span class="osis-sb-panel-title"><i class="fa-solid fa-filter"></i> Filter Program</span>
            <div class="osis-sb-panel-acts">
              <button type="button" class="btn btn-white btn-sm" id="btnResetFilter" title="Reset filter">
                <i class="fa-solid fa-rotate-left"></i> Reset
              </button>
              <button type="button" class="osis-sb-close" title="Tutup filter">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="osis-sb-fields">
            <div class="osis-sb-field grow">
              <label>Sekbid</label>
              <select id="filterSekbid" class="admin-input">
                <option value="">Semua sekbid</option>
              </select>
            </div>
            <div class="osis-sb-field grow">
              <label>Status</label>
              <select id="filterStatus" class="admin-input">
                <option value="">Semua status</option>
                <option value="rencana">Rencana</option>
                <option value="berjalan">Berjalan</option>
                <option value="selesai">Selesai</option>
                <option value="batal">Batal</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="program-cols">
      <div class="program-side">

      <div class="osis-hero">
        <div class="osis-avatar"><i class="fa-solid fa-calendar"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>PROGRAM TAHUNAN</h1>
          <p>Rencana besar OSIS selama satu tahun kepengurusan.</p>
        </div>
        <button
          class="btn btn-red"
          id="btnTambahProgram"
          style="display: none"
        >
          <i class="fa-solid fa-plus"></i> Tambah Program
        </button>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-list"></i> Total</span
          ><b id="statTotal">-</b>
        </div>
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-play"></i> Berjalan</span
          ><b id="statBerjalan">-</b>
        </div>
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-check"></i> Selesai</span
          ><b id="statSelesai">-</b>
        </div>
        <div class="stat-card">
          <span class="lbl"><i class="fa-solid fa-clock"></i> Rencana</span
          ><b id="statRencana">-</b>
        </div>
      </div>
      </div>
      <div class="program-main">

      <div id="programList">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat program tahunan...
        </div>
      </div>
      </div>
      </div>
    </div>

    <!-- POPUP FORM -->
    <div class="program-form" id="programForm">
      <div class="program-form-inner">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
          "
        >
          <span
            style="
              font-weight: 900;
              display: flex;
              align-items: center;
              gap: 8px;
              font-size: 1rem;
            "
            ><i class="fa-solid fa-calendar" style="color: var(--red)"></i>
            <span id="programFormTitle">Tambah Program</span></span
          >
          <button
            class="icon-btn"
            onclick="Program.tutupForm()"
            title="Tutup"
            style="width: 34px; height: 34px; flex-shrink: 0"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="field">
          <label>Nama program</label
          ><input
            type="text"
            id="progNama"
            class="admin-input"
            placeholder="cth: Makrab OSIS 2026"
            maxlength="120"
          />
        </div>
        <div class="field">
          <label>Deskripsi</label
          ><textarea
            id="progDeskripsi"
            class="admin-input admin-textarea"
            placeholder="Deskripsi singkat program..."
            maxlength="1000"
            rows="3"
          ></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <div class="field">
            <label>Sekbid</label
            ><select id="progSekbid" class="admin-input">
              <option value="">— Pilih Sekbid —</option>
            </select>
          </div>
          <div class="field">
            <label>PIC</label
            ><input
              type="text"
              id="progPJ"
              class="admin-input"
              placeholder="Penanggung jawab"
              maxlength="80"
            />
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <div class="field">
            <label>Tanggal mulai</label
            ><input type="date" id="progMulai" class="admin-input" />
          </div>
          <div class="field">
            <label>Tanggal selesai</label
            ><input type="date" id="progSelesai" class="admin-input" />
          </div>
        </div>
        <div class="field">
          <label>Lokasi</label
          ><input
            type="text"
            id="progLokasi"
            class="admin-input"
            placeholder="Aula / Lapangan..."
            maxlength="80"
          />
        </div>
        <div class="field">
          <label>Target peserta</label
          ><input
            type="text"
            id="progTarget"
            class="admin-input"
            placeholder="cth: Seluruh siswa"
            maxlength="80"
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <div class="field">
            <label>Status</label
            ><select id="progStatus" class="admin-input">
              <option value="rencana">Rencana</option>
              <option value="berjalan">Berjalan</option>
              <option value="selesai">Selesai</option>
              <option value="batal">Batal</option>
            </select>
          </div>
          <div class="field">
            <label>Progress (<span id="progProgressLbl">0%</span>)</label
            ><input
              type="range"
              id="progProgress"
              min="0"
              max="100"
              value="0"
              step="5"
              style="width: 100%; accent-color: var(--red)"
            />
          </div>
        </div>
        <div class="field">
          <label>Catatan (opsional)</label
          ><textarea
            id="progCatatan"
            class="admin-input admin-textarea"
            placeholder="Catatan tambahan..."
            maxlength="2000"
            rows="2"
          ></textarea>
        </div>
        <div class="form-actions-row" style="margin-top: 12px">
          <button class="btn btn-white" id="btnBatalProgram">Batal</button>
          <button class="btn btn-red" id="btnSimpanProgram">
            <i class="fa-solid fa-floppy-disk"></i> Simpan
          </button>
        </div>
        <input type="hidden" id="progId" />
      </div>
    </div>

    <!-- POPUP DETAIL -->
    <div class="program-form" id="programDetail">
      <div class="program-form-inner" style="width: min(580px, 100%)">
        <div class="osis-det-mhead">
          <div class="osis-det-mtitle">
            <span class="osis-det-mico red"><i class="fa-solid fa-calendar"></i></span>
            <span>Detail Program</span>
          </div>
          <button
            class="icon-btn"
            onclick="Program.tutupDetail()"
            title="Tutup"
            style="width: 34px; height: 34px; flex-shrink: 0"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="programDetailBody"></div>
        <div class="osis-det-foot">
          <div class="osis-det-foot-left">
            <button class="btn btn-white btn-sm" onclick="Program.tutupDetail()">
              <i class="fa-solid fa-xmark"></i> Tutup
            </button>
          </div>
          <div class="osis-det-foot-right">
            <button class="btn btn-white btn-sm" id="btnEditDariDetail">
              <i class="fa-solid fa-pen"></i> Edit
            </button>
            <button class="btn btn-red btn-sm" id="btnHapusDariDetail">
              <i class="fa-solid fa-trash-can"></i> Hapus
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
