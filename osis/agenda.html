<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=22" />
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/osis-agenda.css?v=3" />
    <script src="../js/supabase.min.js?v=10"></script>
    <script src="../js/config.js?v=14"></script>
    <script src="../js/db.js?v=27" defer></script>
    <script src="../js/aktivitas.js?v=10" defer></script>
    <script src="../js/app.js?v=10" defer></script>
    <script src="../js/dropdown.js?v=1" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/notice.js?v=10" defer></script>
    <script src="../js/upload.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=13" defer></script>
    <script src="../js/osis-auth.js?v=19" defer></script>
    <script src="../js/osis-visitor.js?v=4" defer></script>
    <script src="../js/osis-sidebar.js?v=16" defer></script>
    <script src="../js/osis-header.js?v=14" defer></script>
    <script src="../js/form-persist.js?v=10" defer></script>
    <script src="../js/agenda.js?v=18" defer></script>
    <script src="../js/pwa.js?v=11" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>AGENDA</h2>
          <p>Per Sekbid</p>
        </div>
      </a>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="agenda-wrap">
      <div class="agenda-cols">
      <div class="agenda-side">

      <div class="agenda-head">
        <div class="ico"><i class="fa-solid fa-calendar-days"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>AGENDA</h1>
          <p>
            Kegiatan yang sudah dilaksanakan — terbaru di atas,
            dikelompokkan per hari.
          </p>
        </div>
        <button class="btn btn-red" id="btnTambahAgenda" style="display: none">
          <i class="fa-solid fa-plus"></i> Tambah Agenda
        </button>
      </div>

      <!-- Statistik ringkas -->
      <div class="agenda-stats" id="agendaStats"></div>

      <div class="agenda-toolbar">
        <select
          id="pilihSekbid"
          class="admin-input"
          style="max-width: 280px"
        ></select>
      </div>
      </div>
      <div class="agenda-main">

      <div class="agenda-form" id="agendaForm">
        <div class="agenda-form-inner">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 14px;
            "
          >
            <span
              style="
                font-weight: 900;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 1rem;
              "
              ><i class="fa-solid fa-calendar" style="color: var(--red)"></i>
              <span id="agendaFormTitle">Tambah Agenda</span></span
            >
            <button
              class="icon-btn"
              onclick="AgendaAdmin.tutupForm()"
              title="Tutup"
              style="width: 34px; height: 34px; flex-shrink: 0"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="field">
            <label>Sekbid</label
            ><select id="agendaSekbid" class="admin-input"></select>
          </div>
          <div class="field">
            <label>Judul</label
            ><input
              type="text"
              id="agendaJudul"
              class="admin-input"
              placeholder="Judul agenda"
              maxlength="80"
            />
          </div>
          <div class="field">
            <label>Deskripsi</label
            ><textarea
              id="agendaDeskripsi"
              class="admin-input admin-textarea"
              placeholder="Deskripsi singkat"
              maxlength="500"
              rows="3"
            ></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <div class="field">
              <label>Tanggal</label
              ><input type="date" id="agendaTanggal" class="admin-input" />
            </div>
            <div class="field">
              <label>Lokasi</label
              ><input
                type="text"
                id="agendaLokasi"
                class="admin-input"
                placeholder="Aula / Lapangan"
                maxlength="80"
              />
            </div>
          </div>
          <div class="field">
            <label>Foto (opsional, bisa banyak)</label>
            <div id="agendaDrop" class="agenda-drop">
              <div class="agenda-drop-inner" id="agendaDropInner">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Klik atau drag & drop foto ke sini</span>
                <small
                  >JPG/PNG/WEBP, bisa banyak sekaligus — otomatis kompres
                  &lt;1MB</small
                >
              </div>
            </div>
            <input
              type="file"
              id="agendaFotos"
              accept="image/*"
              multiple
              hidden
            />
          </div>
          <div
            id="agendaPreview"
            class="agenda-fotos"
            style="display: none"
          ></div>
          <div class="form-actions-row" style="margin-top: 12px">
            <button class="btn btn-white" id="btnBatalAgenda">Batal</button>
            <button class="btn btn-red" id="btnSimpanAgenda">
              <i class="fa-solid fa-floppy-disk"></i> Simpan
            </button>
          </div>
          <input type="hidden" id="agendaId" />
        </div>
      </div>

      <div id="agendaList">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat agenda...
        </div>
      </div>
      </div>
      </div>
    </div>

    <!-- POPUP DETAIL: klik foto -->
    <div class="agenda-detail" id="agendaDetail">
      <div class="agenda-detail-inner">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px">
          <span style="font-weight: 900; display: flex; align-items: center; gap: 8px; font-size: 1rem"><i class="fa-solid fa-calendar" style="color: var(--red)"></i> Detail Agenda</span>
          <button class="icon-btn" onclick="AgendaAdmin.tutupDetail()" title="Tutup" style="width: 34px; height: 34px; flex-shrink: 0"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="agendaDetailBody"></div>
      </div>
    </div>
  </body>
</html>
