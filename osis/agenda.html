<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css" />
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      .agenda-wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .agenda-head {
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 4px 4px 0 var(--ink);
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .agenda-head .ico {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        border: 3px solid var(--ink);
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        box-shadow: 2px 2px 0 var(--ink);
        flex-shrink: 0;
      }
      .agenda-head h1 {
        font-size: 1.25rem;
        font-weight: 900;
        line-height: 1.1;
      }
      .agenda-head p {
        font-size: 0.8rem;
        color: var(--gray);
        font-weight: 600;
        margin-top: 4px;
      }
      /* Statistik ringkas */
      .agenda-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .astat {
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        box-shadow: 3px 3px 0 var(--ink);
        padding: 10px 8px;
        text-align: center;
      }
      .astat b {
        display: block;
        font-size: 1.35rem;
        font-weight: 900;
        line-height: 1;
      }
      .astat span {
        font-size: 0.64rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--gray);
      }
      .astat.total b { color: var(--ink); }
      .astat.bulan b { color: #b8860b; }
      .astat.sekbid b { color: var(--red); }
      .astat.orang b { color: #1c7a1c; }
      @media (max-width: 480px) {
        .agenda-stats { grid-template-columns: repeat(2, 1fr); }
      }
      /* Tab tipe: per sekbid / per orang */
      .agenda-tabs {
        display: inline-flex;
        background: var(--paper-2);
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        padding: 4px;
        gap: 4px;
      }
      .atab {
        border: none;
        background: transparent;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--gray);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
      }
      .atab.active {
        background: var(--red);
        color: #fff;
        box-shadow: 2px 2px 0 var(--ink);
      }
      .agenda-toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .agenda-toolbar select {
        flex: 1;
        min-width: 160px;
      }
      /* Grup per sekbid / per orang */
      .agenda-grup {
        margin-bottom: 18px;
      }
      .agenda-grup-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .agenda-grup-head h3 {
        font-size: 1rem;
        font-weight: 900;
      }
      .agenda-grup-count {
        background: var(--red);
        color: #fff;
        border: 2px solid var(--ink);
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 800;
        padding: 2px 10px;
        box-shadow: 2px 2px 0 var(--ink);
      }
      .pelaksana-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .pchip {
        background: var(--paper-2);
        border: 2px solid var(--ink);
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 800;
        padding: 3px 10px;
      }
      .pchip b { color: var(--red); }
      /* Podium per orang */
      .podium {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 18px;
      }
      .podium-card {
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        box-shadow: 3px 3px 0 var(--ink);
        padding: 12px 8px;
        text-align: center;
        position: relative;
      }
      .podium-card.juara1 {
        background: #fff7d6;
        transform: scale(1.04);
      }
      .podium-medal {
        font-size: 1.5rem;
        line-height: 1;
      }
      .podium-card b {
        display: block;
        font-size: 0.85rem;
        font-weight: 900;
        margin-top: 6px;
        overflow-wrap: anywhere;
      }
      .podium-card span {
        font-size: 0.66rem;
        font-weight: 700;
        color: var(--gray);
      }
      .podium-card .podium-total {
        display: inline-block;
        margin-top: 6px;
        background: var(--ink);
        color: #fff;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 800;
        padding: 2px 10px;
      }
      @media (max-width: 480px) {
        .podium-card b { font-size: 0.72rem; }
      }
      /* Kartu agenda */
      .agenda-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #agendaList {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .agenda-card {
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .agenda-card h4 {
        font-size: 0.95rem;
        font-weight: 900;
      }
      .agenda-pelaksana {
        font-size: 0.74rem;
        font-weight: 800;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0 6px;
      }
      .agenda-pelaksana i { color: var(--red); }
      .agenda-sekbid-tag {
        display: inline-block;
        background: var(--paper-2);
        border: 2px solid var(--ink);
        border-radius: 999px;
        font-size: 0.64rem;
        font-weight: 800;
        padding: 2px 10px;
        margin-bottom: 6px;
      }
      .agenda-meta {
        font-size: 0.72rem;
        color: var(--gray);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 4px 0 8px;
      }
      .agenda-fotos {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0;
        flex-wrap: wrap;
      }
      .agenda-fotos img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border: 2px solid var(--ink);
        border-radius: 10px;
        display: block;
      }
      .agenda-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      /* Popup form tambah/edit */
      .agenda-form {
        position: fixed;
        inset: 0;
        background: rgba(15, 10, 11, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 210;
        padding: 18px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          visibility 0.22s ease;
      }
      .agenda-form.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .agenda-form-inner {
        width: min(460px, 100%);
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 6px 6px 0 rgba(15, 10, 11, 0.55);
        max-height: 90vh;
        overflow-y: auto;
        transform: scale(0.96) translateY(10px);
        transition: transform 0.22s cubic-bezier(0.34, 1.3, 0.64, 1);
      }
      .agenda-form.open .agenda-form-inner {
        transform: scale(1) translateY(0);
      }
      .agenda-drop {
        border: 2.5px dashed var(--ink);
        border-radius: 14px;
        background: var(--paper-2);
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .agenda-drop.dragover {
        background: var(--white);
        border-color: var(--red);
      }
      .agenda-drop-inner {
        text-align: center;
        color: var(--gray);
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .agenda-drop-inner i {
        font-size: 1.6rem;
        color: var(--red);
      }
      .agenda-drop-inner small {
        font-size: 0.68rem;
        font-weight: 600;
        opacity: 0.8;
      }
      .agenda-preview-item {
        position: relative;
        flex-shrink: 0;
      }
      .agenda-preview-item img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border: 2px solid var(--ink);
        border-radius: 10px;
        display: block;
      }
      .agenda-preview-item .agenda-preview-del {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 22px;
        height: 22px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #ffe9e9;
        color: var(--red-dark);
        display: grid;
        place-items: center;
        font-size: 0.6rem;
        cursor: pointer;
        box-shadow: 1px 1px 0 var(--ink);
        line-height: 1;
      }
      .agenda-preview-item .agenda-preview-del:active {
        transform: translate(1px, 1px);
        box-shadow: none;
      }
    </style>
    <script src="../js/supabase.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/toast.js" defer></script>
    <script src="../js/show-popup.js" defer></script>
    <script src="../js/osis-auth.js" defer></script>
    <script src="../js/osis-sidebar.js" defer></script>
    <script src="../js/form-persist.js" defer></script>
    <script src="../js/agenda.js" defer></script>
    <script src="../js/pwa.js" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>AGENDA</h2>
          <p>Per Sekbid &amp; Per Orang</p>
        </div>
      </a>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="agenda-wrap">
      <div class="agenda-head">
        <div class="ico"><i class="fa-solid fa-calendar-days"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>AGENDA</h1>
          <p>
            Kegiatan yang sudah dilaksanakan — tercatat per orang, otomatis
            masuk ke sekbidnya.
          </p>
        </div>
        <button class="btn btn-red" id="btnTambahAgenda" style="display: none">
          <i class="fa-solid fa-plus"></i> Tambah Agenda
        </button>
      </div>

      <!-- Statistik ringkas -->
      <div class="agenda-stats" id="agendaStats"></div>

      <!-- Tipe tampilan: per sekbid / per orang (semua tampil, isi ikut sekbid sendiri) -->
      <div class="agenda-tabs" id="agendaTabs">
        <button type="button" class="atab active" data-atab="sekbid">
          <i class="fa-solid fa-folder-open"></i> Per Sekbid
        </button>
        <button type="button" class="atab" data-atab="orang">
          <i class="fa-solid fa-user"></i> Per Orang
        </button>
      </div>

      <div class="agenda-toolbar">
        <select
          id="pilihSekbid"
          class="admin-input"
          style="max-width: 280px"
        ></select>
      </div>

      <div class="agenda-form" id="agendaForm">
        <div class="agenda-form-inner">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 14px;
            "
          >
            <span
              style="
                font-weight: 900;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 1rem;
              "
              ><i class="fa-solid fa-calendar" style="color: var(--red)"></i>
              <span id="agendaFormTitle">Tambah Agenda</span></span
            >
            <button
              class="icon-btn"
              onclick="AgendaAdmin.tutupForm()"
              title="Tutup"
              style="width: 34px; height: 34px; flex-shrink: 0"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="field">
            <label>Sekbid</label
            ><select id="agendaSekbid" class="admin-input"></select>
          </div>
          <div class="field">
            <label>Judul</label
            ><input
              type="text"
              id="agendaJudul"
              class="admin-input"
              placeholder="Judul agenda"
              maxlength="80"
            />
          </div>
          <div class="field">
            <label>Deskripsi</label
            ><textarea
              id="agendaDeskripsi"
              class="admin-input admin-textarea"
              placeholder="Deskripsi singkat"
              maxlength="500"
              rows="3"
            ></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <div class="field">
              <label>Tanggal</label
              ><input type="date" id="agendaTanggal" class="admin-input" />
            </div>
            <div class="field">
              <label>Lokasi</label
              ><input
                type="text"
                id="agendaLokasi"
                class="admin-input"
                placeholder="Aula / Lapangan"
                maxlength="80"
              />
            </div>
          </div>
          <div class="field">
            <label>Urutan</label
            ><input
              type="number"
              id="agendaOrder"
              class="admin-input"
              value="99"
              min="1"
              max="999"
            />
          </div>
          <div class="field">
            <label>Pelaksana</label
            ><select id="agendaPelaksana" class="admin-input"></select>
          </div>
          <div class="field">
            <label>Foto (opsional, bisa banyak)</label>
            <div id="agendaDrop" class="agenda-drop">
              <div class="agenda-drop-inner" id="agendaDropInner">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Klik atau drag & drop foto ke sini</span>
                <small
                  >JPG/PNG/WEBP, bisa banyak sekaligus — otomatis kompres
                  &lt;1MB</small
                >
              </div>
            </div>
            <input
              type="file"
              id="agendaFotos"
              accept="image/*"
              multiple
              hidden
            />
          </div>
          <div
            id="agendaPreview"
            class="agenda-fotos"
            style="display: none"
          ></div>
          <div class="form-actions-row" style="margin-top: 12px">
            <button class="btn btn-white" id="btnBatalAgenda">Batal</button>
            <button class="btn btn-red" id="btnSimpanAgenda">
              <i class="fa-solid fa-floppy-disk"></i> Simpan
            </button>
          </div>
          <input type="hidden" id="agendaId" />
        </div>
      </div>

      <div id="agendaList">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat agenda...
        </div>
      </div>
    </div>
  </body>
</html>
