<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Sekbid — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      .agenda-admin-wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 18px;
      }
      .agenda-toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .agenda-toolbar select {
        flex: 1;
        min-width: 160px;
      }
      .agenda-form {
        position: fixed;
        inset: 0;
        background: rgba(15, 10, 11, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 210;
        padding: 18px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          visibility 0.22s ease;
      }
      .agenda-form.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .agenda-form-inner {
        width: min(460px, 100%);
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 6px 6px 0 rgba(15, 10, 11, 0.55);
        max-height: 90vh;
        overflow-y: auto;
        transform: scale(0.96) translateY(10px);
        transition: transform 0.22s cubic-bezier(0.34, 1.3, 0.64, 1);
      }
      .agenda-form.open .agenda-form-inner {
        transform: scale(1) translateY(0);
      }
      /* OSIS header menu — desktop pill, mobile titik tiga */
      .osis-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .osis-nav-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        background: var(--white);
        font-size: 0.78rem;
        font-weight: 800;
        text-decoration: none;
        color: var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
        transition:
          transform 0.12s,
          box-shadow 0.12s,
          background 0.12s,
          color 0.12s;
        white-space: nowrap;
      }
      .osis-nav-link:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--ink);
      }
      .osis-nav-link:active {
        transform: translate(1px, 1px);
        box-shadow: none;
      }
      .osis-nav-link.active {
        background: var(--red);
        color: #fff;
      }
      #osisMoreWrap {
        display: none;
        position: relative;
      }
      #osisMoreWrap.show {
        display: inline-flex !important;
      }
      #osisMoreMenu .header-more-item.active {
        background: var(--red);
        color: #fff;
      }
      @media (max-width: 640px) {
        .osis-nav {
          display: none !important;
        }
      }
      .agenda-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #agendaList {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .agenda-card {
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .agenda-card h4 {
        font-size: 0.95rem;
        font-weight: 900;
      }
      .agenda-meta {
        font-size: 0.72rem;
        color: var(--gray);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 4px 0 8px;
      }
      .agenda-status {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 800;
        border: 1.5px solid var(--ink);
      }
      .agenda-status.rencana {
        background: var(--yellow);
      }
      .agenda-status.proses {
        background: #ffd6a5;
      }
      .agenda-status.selesai {
        background: #d6f5d6;
      }
      .agenda-status.batal {
        background: #ffe9e9;
      }
      .agenda-fotos {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0;
        flex-wrap: wrap;
      }
      .agenda-fotos img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border: 2px solid var(--ink);
        border-radius: 10px;
        display: block;
      }
      .agenda-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .agenda-drop {
        border: 2.5px dashed var(--ink);
        border-radius: 14px;
        background: var(--paper-2);
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .agenda-drop.dragover {
        background: var(--white);
        border-color: var(--red);
      }
      .agenda-drop-inner {
        text-align: center;
        color: var(--gray);
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .agenda-drop-inner i {
        font-size: 1.6rem;
        color: var(--red);
      }
      .agenda-drop-inner small {
        font-size: 0.68rem;
        font-weight: 600;
        opacity: 0.8;
      }
      .agenda-preview-item {
        position: relative;
        flex-shrink: 0;
      }
      .agenda-preview-item img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border: 2px solid var(--ink);
        border-radius: 10px;
        display: block;
      }
      .agenda-preview-item .agenda-preview-del {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 22px;
        height: 22px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #ffe9e9;
        color: var(--red-dark);
        display: grid;
        place-items: center;
        font-size: 0.6rem;
        cursor: pointer;
        box-shadow: 1px 1px 0 var(--ink);
        line-height: 1;
      }
      .agenda-preview-item .agenda-preview-del:active {
        transform: translate(1px, 1px);
        box-shadow: none;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/toast.js" defer></script>
    <script src="../js/show-popup.js" defer></script>
    <script src="../js/osis-auth.js" defer></script>
    <script src="../js/osis-menu.js" defer></script>
    <script src="../js/agenda.js" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>AGENDA</h2>
          <p>Kelola per Sekbid</p>
        </div>
      </a>
      <nav class="osis-nav" id="osisNav" aria-label="Menu OSIS">
        <a href="index" class="osis-nav-link"
          ><i class="fa-solid fa-grip"></i> Dashboard</a
        >
        <a href="agenda" class="osis-nav-link"
          ><i class="fa-solid fa-calendar-days"></i> Agenda</a
        >
      </nav>
      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >
        <div class="header-more-wrap" id="osisMoreWrap" style="display: none">
          <button
            class="icon-btn"
            id="osisMoreBtn"
            onclick="OsisMenu.toggle()"
            title="Menu OSIS"
          >
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <div class="header-more-menu" id="osisMoreMenu">
            <a href="index" class="header-more-item"
              ><i class="fa-solid fa-grip"></i> Dashboard</a
            >
            <a href="agenda" class="header-more-item"
              ><i class="fa-solid fa-calendar-days"></i> Agenda</a
            >
          </div>
        </div>
        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="agenda-admin-wrap">
      <div class="agenda-toolbar">
        <select
          id="pilihSekbid"
          class="admin-input"
          style="max-width: 280px"
        ></select>
        <button class="btn btn-red" id="btnTambahAgenda">
          <i class="fa-solid fa-plus"></i> Tambah Agenda
        </button>
      </div>

      <div class="agenda-form" id="agendaForm">
        <div class="agenda-form-inner">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 14px;
            "
          >
            <span
              style="
                font-weight: 900;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 1rem;
              "
              ><i class="fa-solid fa-calendar" style="color: var(--red)"></i>
              <span id="agendaFormTitle">Tambah Agenda</span></span
            >
            <button
              class="icon-btn"
              onclick="AgendaAdmin.tutupForm()"
              title="Tutup"
              style="width: 34px; height: 34px; flex-shrink: 0"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="field">
            <label>Judul</label
            ><input
              type="text"
              id="agendaJudul"
              class="admin-input"
              placeholder="Judul agenda"
              maxlength="80"
            />
          </div>
          <div class="field">
            <label>Deskripsi</label
            ><textarea
              id="agendaDeskripsi"
              class="admin-input admin-textarea"
              placeholder="Deskripsi singkat"
              maxlength="500"
              rows="3"
            ></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <div class="field">
              <label>Tanggal</label
              ><input type="date" id="agendaTanggal" class="admin-input" />
            </div>
            <div class="field">
              <label>Lokasi</label
              ><input
                type="text"
                id="agendaLokasi"
                class="admin-input"
                placeholder="Aula / Lapangan"
                maxlength="80"
              />
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <div class="field">
              <label>Status</label
              ><select id="agendaStatus" class="admin-input">
                <option value="rencana">Rencana</option>
                <option value="proses">Proses</option>
                <option value="selesai" selected>Selesai</option>
                <option value="batal">Batal</option>
              </select>
            </div>
            <div class="field">
              <label>Urutan</label
              ><input
                type="number"
                id="agendaOrder"
                class="admin-input"
                value="99"
                min="1"
                max="999"
              />
            </div>
          </div>
          <div class="field">
            <label>Foto (opsional, bisa banyak)</label>
            <div id="agendaDrop" class="agenda-drop">
              <div class="agenda-drop-inner" id="agendaDropInner">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Klik atau drag & drop foto ke sini</span>
                <small
                  >JPG/PNG/WEBP, bisa banyak sekaligus — otomatis kompres
                  &lt;1MB</small
                >
              </div>
            </div>
            <input
              type="file"
              id="agendaFotos"
              accept="image/*"
              multiple
              hidden
            />
          </div>
          <div
            id="agendaPreview"
            class="agenda-fotos"
            style="display: none"
          ></div>
          <div class="form-actions-row" style="margin-top: 12px">
            <button class="btn btn-white" id="btnBatalAgenda">Batal</button>
            <button class="btn btn-red" id="btnSimpanAgenda">
              <i class="fa-solid fa-floppy-disk"></i> Simpan
            </button>
          </div>
          <input type="hidden" id="agendaId" />
        </div>
      </div>

      <div id="agendaList">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat agenda...
        </div>
      </div>
    </div>
  </body>
</html>
