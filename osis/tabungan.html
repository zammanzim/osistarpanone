<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabungan Pengurus — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=22" />
<meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      .tabungan-wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .tabungan-head {
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 4px 4px 0 var(--ink);
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tabungan-head .ico {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        border: 3px solid var(--ink);
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        box-shadow: 2px 2px 0 var(--ink);
        flex-shrink: 0;
      }
      .tabungan-head h1 {
        font-size: 1.25rem;
        font-weight: 900;
        line-height: 1.1;
      }
      .tabungan-head p {
        font-size: 0.8rem;
        color: var(--gray);
        font-weight: 600;
        margin-top: 4px;
      }
      .stat-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stat-group {
        display: grid;
        gap: 8px;
      }
      .stat-group-total {
        grid-template-columns: repeat(2, 1fr);
        text-align: left;
      }
      .stat-group-count {
        grid-template-columns: repeat(3, 1fr);
      }
      @media (min-width: 720px) {
        .stat-group-total {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .stat-card {
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        padding: 10px 8px;
        box-shadow: 3px 3px 0 var(--ink);
        min-width: 0;
      }
      .stat-card .lbl {
        font-size: 0.6rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--gray);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        line-height: 1.3;
        text-align: center;
      }
      .stat-card b {
        display: block;
        font-size: 1.05rem;
        font-weight: 900;
        margin-top: 4px;
        overflow-wrap: anywhere;
        text-align: center;
      }
      .stat-card .stat-suffix {
        font-size: 0.72em;
        font-weight: 700;
      }
      @media (max-width: 720px) {
        .stat-card .stat-suffix {
          display: none;
        }
      }
      @media (max-width: 480px) {
        .stat-group-count {
          gap: 6px;
        }
        .stat-card {
          padding: 8px 6px;
        }
        .stat-card .lbl {
          font-size: 0.56rem;
        }
        .stat-card .lbl i {
          display: none;
        }
      }
      .stat-card.sudah b { color: #146314; }
      .stat-card.belum b { color: var(--red-dark); }
      .rekap-card {
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 4px 4px 0 var(--ink);
      }
      .rekap-card h3 {
        font-size: 0.82rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .rekap-card h3 i { color: var(--red); }
      .tb-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tb-head h3 {
        flex: 1;
        min-width: 0;
        margin-bottom: 0;
        flex-wrap: nowrap;
        overflow: hidden;
      }
      .tb-head h3 > i { flex-shrink: 0; }
      .tb-head h3 .tb-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tb-head h3 .jenis.total {
        flex-shrink: 0;
        margin-left: 0;
      }
      .tb-menu-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .tb-more-btn {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        border: 2px solid var(--ink);
        background: var(--white);
        color: var(--ink);
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .tb-more-btn:hover { background: var(--paper); }
      .tb-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        box-shadow: 3px 3px 0 var(--ink);
        min-width: 180px;
        z-index: 30;
        overflow: hidden;
      }
      .tb-menu[hidden] { display: none; }
      .tb-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        background: none;
        border: 0;
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
      }
      .tb-menu button:hover { background: var(--paper); }
      .tb-menu button i { color: var(--red); }
      .tb-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .tb-foot .jenis.milik { margin-left: auto; }
      .filter-card {
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 4px 4px 0 var(--ink);
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
      }
      .filter-card .field { margin-bottom: 0; }
      .jenis {
        font-size: 0.64rem;
        font-weight: 900;
        text-transform: uppercase;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1.5px solid var(--ink);
        white-space: nowrap;
      }
      .jenis.total { background: var(--paper-2); color: var(--ink); }
      .jenis.masuk { background: #d6f5d6; color: #146314; }
      .jenis.keluar { background: #ffe9e9; color: var(--red-dark); }
      .jenis.milik { background: #146314; color: #fff; }
      .jenis-toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .jenis-toggle button {
        padding: 11px;
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        background: var(--white);
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 900;
        cursor: pointer;
      }
      .jenis-toggle button.on-masuk { background: #d6f5d6; color: #146314; box-shadow: 3px 3px 0 var(--ink); }
      .jenis-toggle button.on-keluar { background: #ffe9e9; color: var(--red-dark); box-shadow: 3px 3px 0 var(--ink); }
      .kas-scroll { overflow-x: auto; }
      table.kas-tabel {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
        min-width: 560px;
      }
      table.kas-tabel th {
        text-align: left;
        font-size: 0.64rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--gray);
        padding: 8px;
        border-bottom: 2.5px solid var(--ink);
        white-space: nowrap;
      }
      table.kas-tabel td {
        padding: 9px 8px;
        border-bottom: 1.5px dashed var(--line);
        vertical-align: middle;
      }
      table.kas-tabel tbody tr {
        cursor: pointer;
      }
      table.kas-tabel tbody tr:hover td {
        background: var(--paper);
      }
      .detail-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
        font-size: 0.82rem;
        margin-top: 10px;
      }
      .detail-info .k {
        font-size: 0.66rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--gray);
      }
      .detail-info .v {
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      table.kas-tabel td.num {
        font-weight: 800;
        white-space: nowrap;
      }
      .cek-btn {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        border: 2px solid var(--ink);
        background: var(--white);
        color: var(--gray);
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .cek-btn.on {
        background: #d6f5d6;
        color: #146314;
      }
      .row-act {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .kas-form {
        position: fixed;
        inset: 0;
        background: rgba(15, 10, 11, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 210;
        padding: 18px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          visibility 0.22s ease;
      }
      .kas-form.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .kas-form-inner {
        width: min(520px, 100%);
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 6px 6px 0 rgba(15, 10, 11, 0.55);
        max-height: 90vh;
        overflow-y: auto;
        transform: scale(0.96) translateY(10px);
        transition: transform 0.22s cubic-bezier(0.34, 1.3, 0.64, 1);
      }
      .kas-form.open .kas-form-inner {
        transform: scale(1) translateY(0);
      }
      /* Pilih nama dari data anggota (ketuk, bukan ketik bebas) */
      .tb-dipilih {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #d6f5d6;
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        padding: 9px 12px;
        font-size: 0.84rem;
        font-weight: 800;
        color: #146314;
        margin-top: 10px;
      }
      .tb-dipilih.kosong {
        background: var(--paper-2);
        color: var(--gray);
      }
      .tb-dipilih .dot {
        width: 22px;
        height: 22px;
        border: 2px solid currentColor;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.68rem;
        flex-shrink: 0;
      }
      .tb-dipilih small {
        margin-left: auto;
        font-size: 0.66rem;
        font-weight: 800;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .tb-tahun {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--ink);
        color: #fff;
        border-radius: 10px;
        padding: 6px 12px;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        margin: 8px 0 6px;
      }
      .tb-tahun:first-child { margin-top: 0; }
      .tb-tahun i { color: var(--yellow); }
      .tb-tahun .cnt {
        margin-left: auto;
        font-size: 0.62rem;
        font-weight: 900;
        background: var(--yellow);
        color: var(--ink);
        border-radius: 999px;
        padding: 1px 9px;
        white-space: nowrap;
      }
      .tb-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 230px;
        overflow-y: auto;
        padding: 2px;
        margin-top: 6px;
      }
      .tb-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        background: var(--white);
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 800;
        cursor: pointer;
        color: var(--ink);
      }
      .tb-item:hover { background: var(--paper); }
      .tb-item .dot {
        width: 22px;
        height: 22px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.68rem;
        flex-shrink: 0;
        background: #fff;
      }
      .tb-item.pilih {
        background: #d6f5d6;
        color: #146314;
      }
      .tb-item.pilih .dot {
        background: #146314;
        border-color: #146314;
        color: #fff;
      }
      @media print {
        body > *:not(#printArea) {
          display: none !important;
        }
        #printArea {
          display: block !important;
        }
      }
    </style>
    <script src="../js/supabase.min.js?v=10"></script>
    <script src="../js/config.js?v=14"></script>
    <script src="../js/db.js?v=22" defer></script>
    <script src="../js/aktivitas.js?v=10" defer></script>
    <script src="../js/app.js?v=10" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/notice.js?v=10" defer></script>
    <script src="../js/upload.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=13" defer></script>
    <script src="../js/osis-auth.js?v=19" defer></script>
    <script src="../js/osis-sidebar.js?v=16" defer></script>
    <script src="../js/osis-header.js?v=10" defer></script>
    <script src="../js/form-persist.js?v=10" defer></script>
    <script src="../js/tabungan.js?v=16" defer></script>
  <script src="../js/pwa.js?v=11" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>TABUNGAN</h2>
          <p>Pengurus OSIS</p>
        </div>
      </a>
      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"><i class="fa-solid fa-house"></i> Beranda</a>
        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="tabungan-wrap">
      <div class="tabungan-head">
        <div class="ico"><i class="fa-solid fa-piggy-bank"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>TABUNGAN PENGURUS</h1>
          <p>Catat setoran tabungan per orang, satu tabel per orang.</p>
        </div>
        <button class="btn btn-red" id="btnTambahTabungan" style="display: none"><i class="fa-solid fa-plus"></i> Tambah Data</button>
      </div>

      <div class="stat-grid">
        <div class="stat-group stat-group-total">
          <div class="stat-card"><span class="lbl"><i class="fa-solid fa-wallet"></i> Total Tabungan</span><b id="statTotal">-</b></div>
          <div class="stat-card"><span class="lbl"><i class="fa-solid fa-calendar-days"></i> Total Bulanan</span><b id="statBulan">-</b></div>
          <div class="stat-card"><span class="lbl"><i class="fa-solid fa-calendar-week"></i> Total Mingguan</span><b id="statMinggu">-</b></div>
          <div class="stat-card"><span class="lbl"><i class="fa-solid fa-calendar-day"></i> Total Harian</span><b id="statHarian">-</b></div>
        </div>
        <div class="stat-group stat-group-count">
          <div class="stat-card"><span class="lbl"><i class="fa-solid fa-users"></i> Penabung</span><b id="statOrang">-</b></div>
          <div class="stat-card sudah"><span class="lbl"><i class="fa-solid fa-square-check"></i> Sudah Ceklis</span><b id="statSudah">-</b></div>
          <div class="stat-card belum"><span class="lbl"><i class="fa-solid fa-square"></i> Belum Ceklis</span><b id="statBelum">-</b></div>
        </div>
      </div>

      <div class="filter-card">
        <div class="field"><label>Cari penabung</label><input type="text" id="filterQ" class="admin-input" placeholder="Ketik nama..." /></div>
        <div class="field"><label>&nbsp;</label><button class="btn btn-white btn-sm" id="btnResetFilter" title="Reset filter"><i class="fa-solid fa-rotate-left"></i></button></div>
      </div>

      <div id="tabunganWrap"><div class="rekap-card"><div class="loading-block"><div class="spinner"></div>Memuat tabungan...</div></div></div>
    </div>

    <!-- POPUP FORM: tambah / edit satu setoran -->
    <div class="kas-form" id="tabForm">
      <div class="kas-form-inner">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px">
          <span style="font-weight: 900; display: flex; align-items: center; gap: 8px; font-size: 1rem"><i class="fa-solid fa-piggy-bank" style="color: var(--red)"></i> <span id="tabFormTitle">Tambah Setoran</span></span>
          <button class="icon-btn" onclick="Tabungan.tutupForm()" title="Tutup" style="width: 34px; height: 34px; flex-shrink: 0"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="field"><label>Jenis</label>
          <div class="jenis-toggle">
            <button type="button" id="jenisMasuk" onclick="Tabungan.setJenis('masuk')">+ Debit</button>
            <button type="button" id="jenisKeluar" onclick="Tabungan.setJenis('keluar')">− Kredit</button>
          </div>
        </div>
        <div class="field" id="tabNamaSearchWrap" style="margin-top:10px"><label>Nama penabung (dari data anggota)</label><input type="text" id="tabNamaSearch" class="admin-input" placeholder="Ketik nama... (ketuk buat pilih)" autocomplete="off" /></div>
        <div class="tb-dipilih kosong" id="tabNamaDipilih"></div>
        <div class="tb-list" id="tabNamaListBox"></div>
        <input type="hidden" id="tabNama" />
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px">
          <div class="field"><label>Tanggal</label><input type="date" id="tabTanggal" class="admin-input" /></div>
          <div class="field"><label>Nominal (Rp)</label><input type="text" id="tabNominal" class="admin-input" placeholder="10.000" inputmode="numeric" autocomplete="off" /></div>
        </div>
        <div class="form-actions-row" style="margin-top: 12px">
          <button class="btn btn-white" id="btnBatalTabungan">Batal</button>
          <button class="btn btn-red" id="btnSimpanTabungan"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
        </div>
        <input type="hidden" id="tabId" />
      </div>
    </div>

    <!-- POPUP DETAIL: klik baris -->
    <div class="kas-form" id="tabDetail">
      <div class="kas-form-inner">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px">
          <span style="font-weight: 900; display: flex; align-items: center; gap: 8px; font-size: 1rem"><i class="fa-solid fa-piggy-bank" style="color: var(--red)"></i> Detail Tabungan</span>
          <button class="icon-btn" onclick="Tabungan.tutupDetail()" title="Tutup" style="width: 34px; height: 34px; flex-shrink: 0"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="tabDetailBody"></div>
        <div class="form-actions-row" style="margin-top: 14px">
          <button class="btn btn-white btn-sm" onclick="Tabungan.tutupDetail()">Tutup</button>
          <button class="btn btn-white btn-sm" id="btnEditDariDetail"><i class="fa-solid fa-pen"></i> Edit</button>
          <button class="btn btn-red btn-sm" id="btnHapusDariDetail"><i class="fa-solid fa-trash-can"></i> Hapus</button>
        </div>
      </div>
    </div>

    <div id="printArea" style="display: none"></div>
  </body>
</html>
