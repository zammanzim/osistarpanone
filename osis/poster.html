<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=11" />
    <link rel="stylesheet" href="../css/osis2.css?v=10" />
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="../js/supabase.min.js?v=10"></script>
    <script src="../js/config.js?v=13"></script>
    <script src="../js/db.js?v=13" defer></script>
    <script src="../js/app.js?v=11" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=11" defer></script>
    <script src="../js/osis-auth.js?v=14" defer></script>
    <script src="../js/osis-sidebar.js?v=13" defer></script>
    <script src="../js/poster.js?v=11" defer></script>
    <script src="../js/pwa.js?v=10" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>POSTER</h2>
          <p>Arsip OSIS</p>
        </div>
      </a>
      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm" style="display: inline-flex"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >
        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="osis-wrap">
      <div class="osis-hero">
        <div class="osis-avatar"><i class="fa-solid fa-newspaper"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>ARSIP POSTER</h1>
          <p>Poster peringatan &amp; acara OSIS — arsip internal, dikelola OSIS.</p>
          <div class="osis-meta"></div>
        </div>
        <button
          class="btn btn-red"
          id="btnTambahPoster"
          onclick="Poster.bukaForm()"
          style="display: none"
        >
          <i class="fa-solid fa-plus"></i> Tambah Poster
        </button>
      </div>

      <div class="poster-feed" id="posterGrid">
        <div class="loading-block">
          <div class="spinner"></div>
          Memuat poster...
        </div>
      </div>
    </div>
  </body>
</html>
