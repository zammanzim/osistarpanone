<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akun OSIS — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="../css/style.css?v=40" />
    <link rel="stylesheet" href="../css/osis2.css?v=12" />
    <link rel="stylesheet" href="../css/osis-akses.css?v=4" />
    <meta name="theme-color" content="#e11d2e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OSIS TARPAN ONE" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="../js/supabase.min.js?v=10"></script>
    <script src="../js/config.js?v=14"></script>
    <script src="../js/db.js?v=35" defer></script>
    <script src="../js/aktivitas.js?v=10" defer></script>
    <script src="../js/app.js?v=10" defer></script>
    <script src="../js/dropdown.js?v=2" defer></script>
    <script src="../js/toast.js?v=10" defer></script>
    <script src="../js/notice.js?v=10" defer></script>
    <script src="../js/show-popup.js?v=14" defer></script>
    <script src="../js/osis-auth.js?v=19" defer></script>
    <script src="../js/osis-visitor.js?v=4" defer></script>
    <script src="../js/osis-sidebar.js?v=45" defer></script>
    <script src="../js/osis-header.js?v=14" defer></script>
    <script src="../js/form-persist.js?v=10" defer></script>
    <script src="../js/osis-users.js?v=2" defer></script>
    <script src="../js/pwa.js?v=11" defer></script>
  </head>
  <body>
    <header class="top-nav">
      <a href="../index#/" class="brand">
        <div class="logo-box"><img data-foto="logo1" alt="Logo" /></div>
        <div class="brand-text">
          <h2>AKUN OSIS</h2>
          <p>Kelola Akun Pengurus</p>
        </div>
      </a>

      <div class="top-nav-extra">
        <a href="../index#/" class="btn btn-white btn-sm"
          ><i class="fa-solid fa-house"></i> Beranda</a
        >

        <div id="areaAuth"></div>
      </div>
    </header>

    <div class="osis-wrap">
      <div class="osis-hero">
        <div class="osis-avatar"><i class="fa-solid fa-user-gear"></i></div>
        <div style="flex: 1; min-width: 180px">
          <h1>AKUN OSIS</h1>
          <p>
            Khusus super admin. Tambah / ubah / hapus akun pengurus: username
            login, nama, jabatan (sekbid otomatis), angkatan, dan password awal.
            Hak per halaman tetap diatur di halaman Akses.
          </p>
          <div class="osis-meta">
            <span class="osis-badge" id="usersCount">-</span>
            <a
              class="osis-badge"
              href="akses"
              style="text-decoration: none; color: inherit"
              ><i class="fa-solid fa-key"></i> Atur Hak Akses</a
            >
          </div>
        </div>
      </div>

      <div class="osis-panel">
        <div class="osis-page-head" style="margin-bottom: 10px">
          <h2>
            <i class="fa-solid fa-address-card" style="color: var(--red)"></i>
            Daftar Akun
          </h2>
          <span class="spacer"></span>
          <button
            class="btn btn-white btn-sm"
            id="btnResetQ"
            title="Reset pencarian"
          >
            <i class="fa-solid fa-rotate-left"></i>
          </button>
          <button class="btn btn-red btn-sm" id="btnTambahUser">
            <i class="fa-solid fa-plus"></i> Tambah Akun
          </button>
        </div>

        <div class="field" style="margin-bottom: 10px">
          <label>Cari akun</label>
          <input
            type="text"
            id="usersQ"
            class="admin-input"
            placeholder="Ketik nama / username / jabatan / angkatan..."
            autocomplete="off"
          />
        </div>

        <div id="usersWrap">
          <div class="loading-block">
            <div class="spinner"></div>
            Memuat akun...
          </div>
        </div>
        <div id="usersEmpty"></div>
      </div>
    </div>
  </body>
</html>
