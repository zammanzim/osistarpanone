<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — OSIS TARPAN ONE</title>
    <meta name="theme-color" content="#e11d2e" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Outfit", system-ui, -apple-system, sans-serif;
        background: #fffdfa; color: #1a1314;
        min-height: 100vh; display: grid; place-items: center; padding: 20px;
      }
      .off-card {
        max-width: 460px; text-align: center;
        background: #fff; border: 3px solid #1a1314; border-radius: 18px;
        padding: 36px 28px; box-shadow: 5px 5px 0 #1a1314;
      }
      .off-card .big { font-size: 3rem; }
      .off-card h1 { font-size: 1.35rem; margin: 12px 0 8px; }
      .off-card p { color: #6f6668; font-size: 0.92rem; margin-bottom: 20px; line-height: 1.6; }
      .btn {
        display: inline-block; padding: 12px 22px;
        background: #e11d2e; color: #fff; font-weight: 800; font-size: 0.88rem;
        text-decoration: none; border: 2.5px solid #1a1314; border-radius: 999px;
        box-shadow: 3px 3px 0 #1a1314;
      }
      .btn:active { transform: translate(2px, 2px); box-shadow: none; }
    </style>
  </head>
  <body>
    <div class="off-card">
      <div class="big">📡</div>
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum tersimpan di perangkat. Sambungkan internet sekali — halaman yang pernah dibuka otomatis bisa diakses offline.</p>
      <a class="btn" href="./">⟵ Kembali ke Beranda</a>
    </div>
  </body>
</html>
