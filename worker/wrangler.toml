# wrangler.toml — Worker osis-media-presign
# Deploy: cd worker && npx wrangler deploy
# Secret (JANGAN taruh di file ini): R2_ACCESS_KEY, R2_SECRET_KEY,
# SUPABASE_SERVICE_KEY (service_role, buat cek link akun + hak upload)
#   npx wrangler secret put R2_ACCESS_KEY
#   npx wrangler secret put R2_SECRET_KEY
#   npx wrangler secret put SUPABASE_SERVICE_KEY

